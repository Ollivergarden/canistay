const REPORT_TYPES = [
  {
    id: "ok",
    label: "Övernattat här (ok)",
    icon: Check,
    tone: "border-emerald-500 bg-emerald-50 text-emerald-700",
  },

  },
];

function ReportScreen({ location, reports, onSubmit }) {
  const [type, setType] = useState("ok");
  const [text, setText] = useState("");
  const [toast, setToast] = useState(false);

  const submit = () => {
    if (!text.trim()) return;
    onSubmit({ id: `r${Date.now()}`, locationId: location.id, type: type, text: text.trim() });
    setText("");
    setToast(true);
    setTimeout(() => setToast(false), 3500);
  };

  return (
    <div className="flex-1 overflow-y-auto">
      <StatusBar />
      <ScreenHeader title="Rapportera" subtitle={`${location.kommun} · ${location.place}`} icon={PinPlus} iconBg="bg-amber-500" />

      {/* Typ */}
      <div className="px-5">
        <p className="text-xs font-bold uppercase tracking-wide text-slate-400">Vad vill du rapportera?</p>
        <div className="mt-2 space-y-2">
          {REPORT_TYPES.map((t) => {
            const TIcon = t.icon;
            const active = type === t.id;
            return (
              <button
                key={t.id}
                onClick={() => setType(t.id)}
                className={`flex w-full items-center gap-3 rounded-xl border-2 p-3.5 text-left text-sm font-semibold transition-colors ${
                  active ? t.tone : "border-slate-200 bg-white text-slate-600"
                }`}
              >
                <TIcon className="h-5 w-5 shrink-0" />
                {t.label}
              </button>
            );
          })}
        </div>
      </div>

      {/* Beskrivning */}
      <div className="px-5 pt-5">
        <p className="text-xs font-bold uppercase tracking-wide text-slate-400">Beskrivning</p>
        <textarea
          value={text}
          onChange={(e) => setText(e.target.value)}
          rows={3}
          placeholder="T.ex. “Stod här en natt i september, ingen skylt syns…”"
          className="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-sm text-slate-800 placeholder:text-slate-400 outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-100"
        />
        <button
          disabled
          className="mt-2 w-full rounded-xl border border-dashed border-slate-300 bg-white p-2.5 text-xs font-semibold text-slate-400"
        >
          + Lägg till foto (kommer i nästa version)
        </button>
      </div>

      {/* Skicka */}
      <div className="px-5 pt-4">
        <button
          onClick={submit}
          disabled={!text.trim()}
          className={`w-full rounded-xl py-3 text-sm font-bold text-white shadow-md transition-colors ${
            text.trim() ? "bg-emerald-600 hover:bg-emerald-700" : "bg-slate-300"
          }`}
        >
          Skicka rapport
        </button>
        <p className="mt-2 text-center text-[11px] text-slate-400">
          Din rapport syns direkt på kartan och hjälper andra husbilsägare.
        </p>
      </div>

      {/* Toast */}
      {toast && (
        <div className="px-5 pt-4">
          <div className="flex items-center gap-2 rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-[13px] font-semibold text-emerald-700">
            <Check className="h-4 w-4" />
            Tack! Rapporten är sparad och syns nu på kartan.
          </div>
        </div>
      )}

      {/* Senaste rapporter */}
      <div className="px-5 pt-5">
        <h3 className="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wide text-slate-400">
          <ClockRotate className="h-3.5 w-3.5" />
          Senaste rapporter här
        </h3>
        <div className="mt-2 space-y-2 pb-6">
          {reports.filter((r) => r.locationId === location.id).length === 0 && (
            <p className="rounded-xl border border-dashed border-slate-200 bg-slate-50 p-4 text-center text-[13px] text-slate-500">
              Inga användarrapporter för den här platsen än – bli först!
            </p>
          )}
          {reports
            .filter((r) => r.locationId === location.id)
            .map((r) => (
              <div key={r.id} className="rounded-xl border border-slate-100 bg-white p-3 shadow-sm">
                <div className="flex items-center gap-2">
                  <Chip className="bg-amber-100 text-amber-800">
                    {REPORT_TYPES.find((t) => t.id === r.type)?.label ?? "Rapport"}
                  </Chip>
                  <span className="text-[10px] text-slate-400">Nyss</span>
                </div>
                <p className="mt-1.5 text-[13px] leading-snug text-slate-600">{r.text}</p>
              </div>
            ))}
        </div>
      </div>
    </div>
  );
}

  unknown: "border-slate-200 bg-slate-100 text-slate-600",
};

const DOTS = [
  ...Array(120).fill("full"),
  ...Array(90).fill("stadge"),
  ...Array(80).fill("ovrig"),
];

const DOT_TONE = {
  full: "bg-emerald-500",
  stadge: "bg-sky-500",
  ovrig: "bg-slate-300",
};

function CoverageScreen() {
  return (
    <div className="flex-1 overflow-y-auto">
      <StatusBar />
      <ScreenHeader
        title="Täckning"
        subtitle="Hur stor del av Sverige kan appen svara på?"
        icon={Navigation}
        iconBg="bg-sky-600"
      />

      {/* Nyckeltal */}
      <div className="grid grid-cols-3 gap-2 px-5 pt-4">
        {[
          { v: "290/290", l: "Basnivå", d: "SCB + trafikregler", cls: "text-emerald-600" },
          { v: "~210", l: "Tolkad stadga", d: "kommuner, est.", cls: "text-sky-600" },
          { v: "~120", l: "Full Gävle-nivå", d: "idag – växer snabbt", cls: "text-amber-600" },
        ].map((c) => (
          <div key={c.l} className="rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
            <p className={`text-lg font-bold leading-tight ${c.cls}`}>{c.v}</p>
            <p className="mt-0.5 text-[11px] font-semibold text-slate-600">{c.l}</p>
            <p className="text-[10px] text-slate-400">{c.d}</p>
          </div>
        ))}
      </div>

      {/* En prick per kommun */}
      <div className="px-5 pt-5">
        <h3 className="text-xs font-bold uppercase tracking-wide text-slate-400">
          Sveriges 290 kommuner
        </h3>
        <p className="mt-1 text-[11px] leading-snug text-slate-400">
          En prick per kommun (demofördelning). Grönt = full Gävle-nivå idag, blått = tolkad
          stadga men detaljplansdata saknas, grått = ej granskad.
        </p>
        <div className="mt-2 flex flex-wrap gap-1 rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
          {DOTS.map((d, i) => (
            <span key={i} className={`h-2 w-2 rounded-full ${DOT_TONE[d]}`}></span>
          ))}
        </div>
        <div className="mt-2 flex flex-wrap gap-3 text-[10px] font-medium text-slate-500">
          <span className="flex items-center gap-1">
            <span className="h-2 w-2 rounded-full bg-emerald-500"></span>Full nivå (~120)
          </span>
          <span className="flex items-center gap-1">
            <span className="h-2 w-2 rounded-full bg-sky-500"></span>Stadga tolkad (~90 till)
          </span>
          <span className="flex items-center gap-1">
            <span className="h-2 w-2 rounded-full bg-slate-300"></span>Ej granskad (~80)
          </span>
        </div>
      </div>

      {/* Datalager */}
      <div className="px-5 pt-5">
        <h3 className="text-xs font-bold uppercase tracking-wide text-slate-400">
          Datalager – kommuner av 290
        </h3>
        <div className="mt-2 space-y-2.5">
          {COVERAGE_LAYERS.map((layer) => (
            <div
              key={layer.name}
              className="rounded-2xl border border-slate-200 bg-white p-3 shadow-sm"
            >
              <div className="flex items-baseline justify-between gap-2">
                <p className="text-[12px] font-semibold text-slate-700">{layer.name}</p>
                <p className="shrink-0 text-[12px] font-bold text-slate-800">
                  {layer.count}
                  <span className="font-normal text-slate-400">/290</span>
                </p>
              </div>
              <div className="mt-1.5 h-2 rounded-full bg-slate-100">
                <div
                  className={`h-2 rounded-full ${layer.measured ? "bg-emerald-500" : "bg-amber-500"}`}
                  style={{ width: Math.round((layer.count / 290) * 100) + "%" }}
                ></div>
              </div>
              <p className="mt-1 text-[10px] text-slate-400">{layer.note}</p>
            </div>
          ))}
        </div>
      </div>

      {/* NGP-trend */}
      <div className="px-5 pt-5">
        <h3 className="text-xs font-bold uppercase tracking-wide text-slate-400">
          Detaljplansdata i NGP växer snabbt
        </h3>
        <div className="mt-2 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <div className="flex items-end justify-between gap-3">
            {NGP_TREND.map((t) => (
              <div key={t.period} className="flex flex-1 flex-col items-center gap-1">
                <span className="text-[10px] font-bold text-slate-700">{t.count}</span>
                <div className="flex h-[90px] w-full max-w-[52px] items-end justify-center rounded-t-lg bg-slate-100">
                  <div
                    className="w-full rounded-t-lg bg-sky-500"
                    style={{
                      height: Math.max(4, Math.round((t.count / 252) * 90)) + "px",
                    }}
                  ></div>
                </div>
                <span className="text-[10px] text-slate-400">{t.period}</span>
              </div>
            ))}
          </div>
          <p className="mt-2 text-[10px] leading-snug text-slate-400">
            Planer påbörjade före 2022 behöver inte levereras digitalt – därför är full
            Gävle-nivå lagom bakom NGP-kurvan.
          </p>
        </div>
      </div>

      {/* Stickprov */}
      <div className="px-5 pt-5">
        <h3 className="text-xs font-bold uppercase tracking-wide text-slate-400">
          Stickprov: 10 slumpmässiga kommuner (okt 2026)
        </h3>
        <div className="mt-2 space-y-2">
          {STICKPROV.map((p) => (
            <div
              key={p.kommun}
              className={`flex items-center justify-between gap-2 rounded-xl border p-3 shadow-sm ${PROV_TONE[p.tone]}`}
            >
              <span className="text-[13px] font-semibold">{p.kommun}</span>
              <span className="text-right text-[11px] font-medium opacity-80">
                {p.resultat}
              </span>
            </div>
          ))}
        </div>
      </div>

      <div className="px-5 pb-6 pt-4">
        <p className="text-center text-[10px] leading-relaxed text-slate-400">
          Källor: SCB tätorter 2023 · Transportstyrelsens trafikföreskriftssamling ·
          Lantmäteriet NGP (252 kommuner, apr 2026) · kommunala ordningsstadgor.
          Uppskattningar från stickprov – prototyp, ej juridisk rådgivning.
        </p>
      </div>
    </div>
  );
}

function App() {
  const [locId, setLocId] = useState("gavle-skeppsbron");
  const [tab, setTab] = useState("hem");
  const [reports, setReports] = useState([]);
  const location = LOCATIONS.find((l) => l.id === locId) ?? LOCATIONS[0];

  const tabs = [
    { id: "hem", label: "Hem", icon: HousePin },
    { id: "karta", label: "Karta", icon: Map },
    { id: "regler", label: "Regler", icon: Book },
    { id: "tackning", label: "Täckning", icon: Navigation },
    { id: "rapportera", label: "Rapportera", icon: PinPlus },
  ];

  return (
    <div className="flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 p-4">
      <div className="flex h-[860px] w-full max-w-[420px] flex-col overflow-hidden rounded-[2.2rem] border border-slate-700/50 bg-slate-50 shadow-2xl">
        {tab === "hem" && <HomeScreen location={location} onSelect={setLocId} />}
        {tab === "karta" && (
          <MapScreen location={location} reports={reports} />
        )}
        {tab === "regler" && <RulesScreen location={location} />}
        {tab === "tackning" && <CoverageScreen />}
        {tab === "rapportera" && (
          <ReportScreen
            location={location}
            reports={reports}
            onSubmit={(r) => setReports((prev) => [r, ...prev])}
          />
        )}

        {/* Tab bar */}
        <div className="flex border-t border-slate-200 bg-white px-2 py-2">
          {tabs.map((t) => {
            const TabIcon = t.icon;
            const active = tab === t.id;
            return (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                className={`flex flex-1 flex-col items-center gap-0.5 rounded-xl py-1.5 transition-colors ${
                  active ? "bg-emerald-50 text-emerald-600" : "text-slate-400 hover:text-slate-600"
                }`}
              >
                <TabIcon className="h-5 w-5" />
                <span className="text-[10px] font-semibold">{t.label}</span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
